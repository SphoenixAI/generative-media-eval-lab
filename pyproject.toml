[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sphoenix-eval-lab"
version = "0.1.0"
description = "Intent-aware, evidence-preserving generative media evaluation backend"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "sqlalchemy>=2.0,<3", "fastapi>=0.115,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "krippendorff>=0.8,<1"]

[project.scripts]
eval-lab = "eval_lab.demo:main"
eval-lab-check = "eval_lab.harness:main"
eval-pilot = "eval_lab.pilot_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
