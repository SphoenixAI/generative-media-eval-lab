notes = "Sphoenix approval 2026-10-09, amendment A2, Sections 5.2 and 5.3. Not D01: matches are written by people.\n\nAfter the reveal, a human (the judge or Sphoenix) records, for each MUST and SHOULD criterion of the revealed revision, whether the blind intent_inference recovered it: RECOVERED, PARTIAL, MISSED or UNKNOWN. Automatic text matching would be a judge (D01).\nReport: counts by status and criterion priority, separately for each viewing profile.\nIn a feed nobody reads the brief. Legibility asks whether the clip carries its intent without it.\nThe docs name two borrowings: the message-takeaway checks of advertising copy testing, and the action-and-reason format of the Pitt Ads dataset (Hussain et al., CVPR 2017). The format only; importing that dataset stays deferred (D12).\n\nCommon approved constraints (A2 Section 5.3):\n- **I1.** For real clips, the loop never writes statements, changes, legibility matches or assessments. Instruments write InstrumentRun records only, never observations.\n- **I5.** Statements, instrument runs and claim checks never reference intent. Only post-reveal assessments and legibility matches do.\n- **I2.** Anything not measured is UNMEASURABLE or UNKNOWN, never a pass.\n- **I8, exactly as written:** \"No average hides a failure. Aggregates keep the worst case for each dimension. No decision uses a mean.\" Instruments report per-frame values and the worst frame alongside any span mean. Every claim check states which summary it uses, and checks that a failure could hide in use the worst frame.\n- **I9.** No probabilities.\n- **I12.** Canary status, judge identities and witness cards never appear in public or embed payloads.\n- **Snapshots.** New record types are included in private dataset snapshots. This is the gap that failed L11.\n- **Faces.** Instruments measure regions, color, timing and motion. They do no face identification, no expression or emotion reading, no deception scoring and no inference about a person's intent.\n- **Media.** Generate test clips with ffmpeg lavfi in a temp folder at test time. Never commit media files: G6 forbids video extensions, and G7 counts them as changed lines.\n- **Excluded tools.** No cloud media APIs. No new AGPL or GPL dependencies; the pinned ffmpeg build is existing human-installed tooling.\n- **Size.** Split an item with `STEP-N-split.toml` if it will not fit in 900 changed lines.\n\nAcceptance:\n- Match records exist only for MUST and SHOULD criteria of the revealed revision.\n- A match recorded before the reveal is rejected.\n- UNKNOWN propagates, and nothing defaults to MISSED.\n- FEED and STUDIO results are never pooled.\n- Match records are included in private dataset snapshots."

