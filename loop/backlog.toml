probes = ["Which filters in the pinned ffmpeg build can recolor a rectangle, drop or duplicate frames, and retime a clip? Run ffmpeg -filters and cite the output."]
acceptance = ["The same source clip, dose and ffmpeg hash produce byte-identical variants.", "Every REGION_COLOR variant's CIEDE2000 dose, measured on the worst frame by the WP02 instrument, is within 0.5 of the requested dose for doses up to 3 and within 15 percent above 3; variants outside that are rejected.", "A canary manifest revealed before every blind statement in its queue is sealed is rejected.", "The detection report for a TEST-ONLY detection table matches hand-computed values, including INSUFFICIENT levels.", "Canary status never appears in public or embed payloads, and queues and manifests are included in private dataset snapshots.", "A dose measured by an instrument that is not VALIDATED for that clip's domain is recorded as UNVERIFIED_DOSE, and such canaries are excluded from detection thresholds."]
notes = "Sphoenix approval 2026-10-09, amendment A2, Sections 5.2 and 5.3. Narrowed from D04 and D07: synthetic known-dose proficiency items and detection counts only; these are not test-retest reliability tooling.\n\nQueue: an ordered list of clip refs assigned to one judge for blind statements.\nPerturbations, each with one declared dose:\nREGION_COLOR: shift a rectangle by a target CIEDE2000, for example 1, 2, 3, 5 and 8, along a declared axis (warmer, cooler, lighter or darker).\nFRAME_CADENCE: drop or duplicate k frames at a declared index, for k = 1, 2 or 3.\nSPEED: retime by a declared percentage.\nREFRAME: shift the picture by N pixels. Record its dose from the transform as UNVERIFIED_DOSE until a position instrument exists.\n\nCanaryManifest: the queue; which items are canaries; source; requested and measured doses; k and n for the detection rule (default 3 of 4). Sealed with the L03 mechanism before the first session on the queue, and revealed only after every blind statement in the queue is sealed. Private.\n\nDetection: a blind observation in the matching dimension, whose span overlaps the dosed span, with deviation MINOR or worse, counts as DETECTED; otherwise MISSED. Matching by region waits for an observation format that carries regions.\nReport per judge and measurand: detected and total at each dose, and the lowest dose detected in at least k of n trials. A level with fewer than n trials is INSUFFICIENT. No curve fitting and no probability statements.\nOn real clips only Sphoenix runs the generator, and its outputs go to the operator workspace. Tests use lavfi sources generated at test time.\n\nCommon approved constraints (A2 Section 5.3):\n- **I1.** For real clips, the loop never writes statements, changes, legibility matches or assessments. Instruments write InstrumentRun records only, never observations.\n- **I5.** Statements, instrument runs and claim checks never reference intent. Only post-reveal assessments and legibility matches do.\n- **I2.** Anything not measured is UNMEASURABLE or UNKNOWN, never a pass.\n- **I8, exactly as written:** \"No average hides a failure. Aggregates keep the worst case for each dimension. No decision uses a mean.\" Instruments report per-frame values and the worst frame alongside any span mean. Every claim check states which summary it uses, and checks that a failure could hide in use the worst frame.\n- **I9.** No probabilities.\n- **I12.** Canary status, judge identities and witness cards never appear in public or embed payloads.\n- **Snapshots.** New record types are included in private dataset snapshots. This is the gap that failed L11.\n- **Faces.** Instruments measure regions, color, timing and motion. They do no face identification, no expression or emotion reading, no deception scoring and no inference about a person's intent.\n- **Media.** Generate test clips with ffmpeg lavfi in a temp folder at test time. Never commit media files: G6 forbids video extensions, and G7 counts them as changed lines.\n- **Excluded tools.** No cloud media APIs. No new AGPL or GPL dependencies; the pinned ffmpeg build is existing human-installed tooling.\n- **Size.** Split an item with `STEP-N-split.toml` if it will not fit in 900 changed lines.\n\nAcceptance:\n- The same source clip, dose and ffmpeg hash produce byte-identical variants.\n- Every REGION_COLOR variant's CIEDE2000 dose, measured on the worst frame by the WP02 instrument, is within 0.5 of the requested dose for doses up to 3 and within 15 percent above 3; variants outside that are rejected.\n- A canary manifest revealed before every blind statement in its queue is sealed is rejected.\n- The detection report for a TEST-ONLY detection table matches hand-computed values, including INSUFFICIENT levels.\n- Canary status never appears in public or embed payloads, and queues and manifests are included in private dataset snapshots.\n- A dose measured by an instrument that is not VALIDATED for that clip's domain is recorded as UNVERIFIED_DOSE, and such canaries are excluded from detection thresholds."

