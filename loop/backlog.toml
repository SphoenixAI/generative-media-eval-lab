probes = ["How does WP01 store exposure sets and reveal events, and how does WP03 route a claim to an instrument? Cite file:line."]
acceptance = [
  "A HUMAN session sealed under any partition other than the one HUMAN_MEDIA_FIRST_V1 defines is rejected.",
  "A MODEL partition session is accepted only for TEST-ONLY fixture clips, and no model is called.",
  "A withheld-evidence prediction must be sealed before the withheld evidence is revealed; a prediction timed after the reveal is rejected.",
  "Prediction checks follow WP03 and A2.1 Rule 1: SUPPORTED or CONTRADICTED only with VALIDATED, in-scope instruments, otherwise MEASURED_UNVALIDATED or UNMEASURABLE.",
  "In a TEST-ONLY fixture with two MODEL partitions that differ only in the PROMPT channel, a claim present only under the PROMPT-visible partition is reported as dependent on PROMPT.",
  "Partitions, predictions and dependence reports are included in private dataset snapshots and absent from public and embed payloads.",
]
notes = """Sphoenix approval 2026-10-09, amendment A4. Narrowed from A3-01. Not D01: MODEL sessions are fixture-only.
SC3-Eval analogue: cross-view consistency (each view filled in from the others).

EvidencePartition: id; visible channels (the WP01 channel set); visible time spans (a list of [start_s, end_s] or ALL); visible regions (normalized rectangles or ALL); visible views (view ids or ALL); digest using the L03 canonical digest.
A partition session is a WP01 WitnessSession whose blind statement is sealed under a declared EvidencePartition.
WithheldPrediction: session ref; target (a withheld span, region, view or channel); a predicate from the WP03 vocabulary; the predicted value or class; sealed with the L03 mechanism before the reveal.
After the reveal, each prediction is checked like a WP03 claim, with dependency families (A2.1 Rule 3).
Dependence report: for one clip and judge kind, compare statements across partitions and list each claim that appears only when a given channel, span, region or view is visible. This is the record of which evidence an answer depends on.
Human use of partitions other than HUMAN_MEDIA_FIRST_V1 waits for a protocol Sphoenix approves."""

