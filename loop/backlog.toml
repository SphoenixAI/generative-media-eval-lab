acceptance = [
  "A candidate whose outcomes are NON_DIAGNOSTIC for the unresolved named hypotheses is skipped, with that reason.",
  "A candidate none of whose possible outcomes changes the decision, when the decision policy is re-run on the hypothesis states L10 would produce for each outcome, is skipped, with that reason.",
  "A candidate whose instrument is not VALIDATED for the input's domain is marked CONTEXT_ONLY and never ranked as able to settle the dispute.",
  "Eligible candidates are ranked by validated scope, then existing equivalent evidence, then declared cost, then declared latency; one fixture checks each tie-break.",
  "Identical inputs produce byte-identical routing plans.",
  "The router only plans: it never runs an instrument, a challenge or a model.",
  "No routing record contains a probability, an expected value or an information-gain field.",
]
notes = """Sphoenix approval 2026-10-09, amendment A4. Narrowed from A3-02.
Decides which SC3-style checks are worth running.

Inputs: an unresolved competing set (L07) with a frozen test plan or declared candidate tests (L08 predictions: hypothesis to outcome ids); the current decision and its policy (L06); candidate tests, each either an instrument spec (WP02) or a declared challenge, with outcome categories, declared cost in seconds and declared latency.
For each candidate:
1. Diagnosticity, using L08's classes over named hypotheses.
2. Decision relevance: for each possible outcome, compute the hypothesis states L10 would assign (ELIMINATED or RETAINED; the residual is never eliminated), re-run the L06 policy with those states, and compare the decision.
3. Validity: is the instrument VALIDATED for this input's domain (A2.1 Rule 1)?
Output: a RoutingPlan record listing every candidate with its verdict (RUN_FIRST, RUN_LATER, CONTEXT_ONLY or SKIP) and the reason. Deterministic, digest-pinned, private."""

