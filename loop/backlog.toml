rationale = "Fills the UNMEASURABLE predicates from WP03 with local instruments."
notes = "Candidates checked on 2026-10-09; verify again before approval.\nMediaPipe pose and hand landmarkers (Apache 2.0, native arm64 wheels): BODY_MOTION.\nOpenCV DIS optical flow (Apache 2.0, CPU): CAMERA_MOVE for pan, tilt and zoom. CameraBench (2025) found that geometric methods miss tracking shots, so those stay UNMEASURABLE.\nRF-DETR sizes N to L, or OWLv2 (both Apache 2.0): PRESENCE. Not RF-DETR XL or 2XL, which use the Platform Model License.\nSAM 3.1 (SAM License): POSITION, and masks for REGION_COLOR. The official code targets CUDA. Mac ports are community builds at about 2 to 3 seconds per frame, so run on keyframes only and pin the port commit and the weight hash.\nDINOv3 (DINOv3 License): drift in object identity inside masks.\nExcluded: Ultralytics YOLO and YOLOE (AGPL-3.0); YOLO-World (GPL-3.0); cloud APIs, because media stays local; V-JEPA surprise as a claim instrument, because 2026 work found it near chance as a direct detector of physics violations; anything that reads faces for identity, expression or emotion.\nThe SAM and DINOv3 licenses restrict ITAR-covered activities and military or warfare end uses; read both before approval.\nShape: an optional extra, adapters behind the WP02 contract, and fakes in tests. Sphoenix installs the weights and runs the adapters.\n\nCommon approved constraints (A2 Section 5.3):\n- **I1.** For real clips, the loop never writes statements, changes, legibility matches or assessments. Instruments write InstrumentRun records only, never observations.\n- **I5.** Statements, instrument runs and claim checks never reference intent. Only post-reveal assessments and legibility matches do.\n- **I2.** Anything not measured is UNMEASURABLE or UNKNOWN, never a pass.\n- **I8, exactly as written:** \"No average hides a failure. Aggregates keep the worst case for each dimension. No decision uses a mean.\" Instruments report per-frame values and the worst frame alongside any span mean. Every claim check states which summary it uses, and checks that a failure could hide in use the worst frame.\n- **I9.** No probabilities.\n- **I12.** Canary status, judge identities and witness cards never appear in public or embed payloads.\n- **Snapshots.** New record types are included in private dataset snapshots. This is the gap that failed L11.\n- **Faces.** Instruments measure regions, color, timing and motion. They do no face identification, no expression or emotion reading, no deception scoring and no inference about a person's intent.\n- **Media.** Generate test clips with ffmpeg lavfi in a temp folder at test time. Never commit media files: G6 forbids video extensions, and G7 counts them as changed lines.\n- **Excluded tools.** No cloud media APIs. No new AGPL or GPL dependencies; the pinned ffmpeg build is existing human-installed tooling.\n- **Size.** Split an item with `STEP-N-split.toml` if it will not fit in 900 changed lines.\n\nAcceptance:\n- Proposal only: Sphoenix decides the tools, their licenses and any optional dependencies before implementation."

