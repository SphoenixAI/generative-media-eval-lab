acceptance = ["docs/witness-protocol.md describes only what is built, with the commands to run it.", "It names prior work and states plainly what is not new.", "No superiority claims and no real-media results.", "House style: plain, specific sentences; no em dashes; no hype.", "The document states that instrument authority is scoped by validation and that measurement is evidence, not ground truth.", "Conceptual examples that the lab cannot yet measure, such as a subject that appears to slide, are labelled as hypothesis examples and claim no measured result."]
notes = "Sphoenix approval 2026-10-09, amendment A2, Sections 5.2 and 5.3.\n\nPrior work to cite. The researcher verifies each item before it is used:\nLinear Sequential Unmasking (Dror et al. 2015) and LSU-E (Dror and Kukucka 2021);\nblind proficiency testing at the Houston Forensic Science Center, and PCAST 2016 on blind testing within casework;\nVideoAlign / VideoReward (arXiv 2501.13918), which scores visual quality before reading the prompt;\nXu, \"Don't Read the Log\" (arXiv 2609.28564), on execution traces contaminating video verifiers;\nLai and Huang (arXiv 2609.00067), on context-blind visual witnesses;\nLMM-JND (arXiv 2507.00490), on just-noticeable differences for multimodal models;\nUniHD (ACL 2024), on tool-based claim verification;\nVideoArgus (arXiv 2608.05485), on rubrics written before outputs are seen;\nEmu Video's JUICE (arXiv 2311.10709), on raters justifying their choices.\nNovelty, as far as the 2026-10-09 search found: independent instruments check the judges' own claims; a real intent reveal is measured for how it changes a judge's observations; disputes are routed on those results. Write \"as far as we found\", never \"first\".\n\nCommon approved constraints (A2 Section 5.3):\n- **I1.** For real clips, the loop never writes statements, changes, legibility matches or assessments. Instruments write InstrumentRun records only, never observations.\n- **I5.** Statements, instrument runs and claim checks never reference intent. Only post-reveal assessments and legibility matches do.\n- **I2.** Anything not measured is UNMEASURABLE or UNKNOWN, never a pass.\n- **I8, exactly as written:** \"No average hides a failure. Aggregates keep the worst case for each dimension. No decision uses a mean.\" Instruments report per-frame values and the worst frame alongside any span mean. Every claim check states which summary it uses, and checks that a failure could hide in use the worst frame.\n- **I9.** No probabilities.\n- **I12.** Canary status, judge identities and witness cards never appear in public or embed payloads.\n- **Snapshots.** New record types are included in private dataset snapshots. This is the gap that failed L11.\n- **Faces.** Instruments measure regions, color, timing and motion. They do no face identification, no expression or emotion reading, no deception scoring and no inference about a person's intent.\n- **Media.** Generate test clips with ffmpeg lavfi in a temp folder at test time. Never commit media files: G6 forbids video extensions, and G7 counts them as changed lines.\n- **Excluded tools.** No cloud media APIs. No new AGPL or GPL dependencies; the pinned ffmpeg build is existing human-installed tooling.\n- **Size.** Split an item with `STEP-N-split.toml` if it will not fit in 900 changed lines.\n\nA2.1 Rule 5: An instrument measurement is evidence whose authority depends on validation. It is never ground truth because a machine produced it. CONTRADICTED means a VALIDATED, in-scope measurement disagrees with the observation. The observation stays stored, unchanged, and is never marked false.\n\nAcceptance:\n- docs/witness-protocol.md describes only what is built, with the commands to run it.\n- It names prior work and states plainly what is not new.\n- No superiority claims and no real-media results.\n- House style: plain, specific sentences; no em dashes; no hype.\n- The document states that instrument authority is scoped by validation and that measurement is evidence, not ground truth.\n- Conceptual examples that the lab cannot yet measure, such as a subject that appears to slide, are labelled as hypothesis examples and claim no measured result."
