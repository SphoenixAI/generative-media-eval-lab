rationale = "Run only the instruments and challenges whose results could change the decision, with no probability arithmetic (I9)."
notes = "Proposed 2026-10-09 (A3). For a claim or an unresolved hypothesis set, consider each candidate instrument or challenge:\n1. Diagnostic: is it diagnostic for the unresolved hypotheses under L08's classes? If NON_DIAGNOSTIC, skip it.\n2. Decision-relevant: re-run the current DecisionPolicy under each of its possible outcomes. If no outcome changes the decision, skip it.\n3. Valid: is the instrument VALIDATED for this input's domain (A2.1 Rule 1)? If not, it cannot settle anything; it can only add MEASURED_UNVALIDATED context.\nTie-break among eligible candidates: validated scope, then existing cached evidence, then cost, then latency.\nDeterministic, auditable, and no expected-information-gain numbers (D08 stays deferred).\n\nA2.1 Part 2: Sphoenix decides at H4, after L04 to L12 are integrated and the first three human cases exist. Do not approve, auto-approve or build this proposal. It never blocks approved items and never expands their evaluation scope.\n\nAcceptance:\n- Proposal only: Sphoenix decides scope after L04 to L12 are integrated and the first three human cases exist.\n\nNarrowed slice approved as SC02 (A4, 2026-10-09)."

