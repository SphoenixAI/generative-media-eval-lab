rationale = "Earn instrument authority in order, from exact synthetic ground truth to real multi-view footage to generated media."
notes = "Proposed 2026-10-09 (A3). Order:\n1. Known-dose lab clips (WP04).\n2. Kubric synthetic scenes (Apache 2.0) with exact masks, depth and optical flow.\n3. Ego-Exo4D (Meta; about 1,286 hours, 4 to 5 synchronized exocentric cameras per take, consented participants, 3D body and hand pose). Access requires accepting its license agreement; Sphoenix reviews it first.\n4. Generated-media-specific validation, because real footage does not validate instruments on generated failures such as melting hands or morphing objects.\nEach step writes ValidationRecords with a scope (A2.1 Rule 1). No instrument is VALIDATED for generated media on the strength of real-footage results alone.\n\nA2.1 Part 2: Sphoenix decides at H4, after L04 to L12 are integrated and the first three human cases exist. Do not approve, auto-approve or build this proposal. It never blocks approved items and never expands their evaluation scope.\n\nAcceptance:\n- Proposal only: Sphoenix decides scope and data licenses before implementation."

