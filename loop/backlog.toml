notes = "Sphoenix approval 2026-10-09, amendment A2, Sections 5.2 and 5.3.\n\nA dispute: two or more witness sessions on the same clip and criterion whose post-reveal assessments differ in status.\nClasses, checked in this order, first match wins:\nSUGGESTION: every session in the dispute is BLIND, and an observation a side cites is SUGGESTED or one of its withdrawn blind claims is ABANDONED_TRUE.\nPERCEPTION: one side cites a CONTRADICTED observation and the other side a SUPPORTED one.\nTHRESHOLD: the measured size of the disputed property falls between the two judges' lowest reliable doses for that measurand.\nTASTE: every session is BLIND; both sides cite only SUPPORTED or UNMEASURABLE observations; both judges have proficiency records for the dimension; and none of the classes above applies.\nINSUFFICIENT: everything else.\nOrder rationale: suggestion and perception are explained by evidence the system already holds, so they are settled first. Taste is what remains when nothing measurable explains the dispute.\n\nWitness card per judge: sessions by blindness; claims checked and contradicted, by dimension; post-reveal classes; lowest reliable doses by measurand. Counts only, kept separate by dimension.\nClasses never change an assessment, a decision or a policy (I6).\n\nCommon approved constraints (A2 Section 5.3):\n- **I1.** For real clips, the loop never writes statements, changes, legibility matches or assessments. Instruments write InstrumentRun records only, never observations.\n- **I5.** Statements, instrument runs and claim checks never reference intent. Only post-reveal assessments and legibility matches do.\n- **I2.** Anything not measured is UNMEASURABLE or UNKNOWN, never a pass.\n- **I8, exactly as written:** \"No average hides a failure. Aggregates keep the worst case for each dimension. No decision uses a mean.\" Instruments report per-frame values and the worst frame alongside any span mean. Every claim check states which summary it uses, and checks that a failure could hide in use the worst frame.\n- **I9.** No probabilities.\n- **I12.** Canary status, judge identities and witness cards never appear in public or embed payloads.\n- **Snapshots.** New record types are included in private dataset snapshots. This is the gap that failed L11.\n- **Faces.** Instruments measure regions, color, timing and motion. They do no face identification, no expression or emotion reading, no deception scoring and no inference about a person's intent.\n- **Media.** Generate test clips with ffmpeg lavfi in a temp folder at test time. Never commit media files: G6 forbids video extensions, and G7 counts them as changed lines.\n- **Excluded tools.** No cloud media APIs. No new AGPL or GPL dependencies; the pinned ffmpeg build is existing human-installed tooling.\n- **Size.** Split an item with `STEP-N-split.toml` if it will not fit in 900 changed lines.\n\nAcceptance:\n- One TEST-ONLY fixture per class: SUGGESTION, PERCEPTION, THRESHOLD, TASTE and INSUFFICIENT.\n- Only TASTE disputes enter the senior queue, each with the measured facts, both sides' warrants, qualifiers and rebuttals, and both witness cards.\n- A dispute involving a NOT_BLIND session is never SUGGESTION or TASTE.\n- A fixture that satisfies two classes gets the first one in the documented order.\n- Existing disagreement tests pass unchanged, and a regression test shows that disagreement.py output is unchanged.\n- Disputes, classes and witness cards are included in private dataset snapshots and absent from public and embed payloads.\n- PERCEPTION and THRESHOLD require VALIDATED, in-scope checks; with only MEASURED_UNVALIDATED evidence the dispute is INSUFFICIENT.\n\nPriority raised to P0 by A4, 2026-10-09."

