acceptance = ["Proposal only: Sphoenix decides scope after L04 to L12 are integrated and the first three human cases exist."]
rationale = "Test whether a judge's verdict actually depends on the factor its warrant names."
notes = "Proposed 2026-10-09 (A3). Take the factor a warrant names (for example, a warm grade). Produce a measured, minimal edit of that factor with the WP04 machinery. Check whether the verdict moves as the warrant predicts. A warrant that survives the edit is backed; one that does not is recorded as an unbacked reason, beside the verdict and never replacing it.\nFor humans this compares stated reasons with revealed preferences; for model judges it tests rationale faithfulness.\nPrior art: explanation-driven counterfactual testing for visual question answering (EDCT, arXiv 2510.00047; EDCT-Bench, arXiv 2609.17953). The 2026-10-09 search found no version for judges of generated media, with measured doses, or for human raters.\nControl for edit seams: small, measured doses, plus a sham edit of equal size on an unrelated region.\n\nA2.1 Part 2: Sphoenix decides at H4, after L04 to L12 are integrated and the first three human cases exist. Do not approve, auto-approve or build this proposal. It never blocks approved items and never expands their evaluation scope.\n\nAcceptance:\n- Proposal only: Sphoenix decides scope after L04 to L12 are integrated and the first three human cases exist.\n\nNarrowed slice approved as SC03 (A4, 2026-10-09). The human counterfactual protocol stays PROPOSED."

