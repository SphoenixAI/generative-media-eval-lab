[[item]]
id = "L08"
title = "Test plans with qualitative predictions"
priority = "P0"
approval = "APPROVED"
size = "M"
risk = "MEDIUM"
category = "domain"
depends_on = ["L03", "L04", "L07"]
human_review = false
