rationale = "Generalizes the intent reveal to any exposure channel, so the lab measures which evidence a judgment depends on."
notes = "Proposed 2026-10-09 (A3). A witness statement is sealed under a declared evidence partition: which channels, time spans, regions and views were visible. Then one source is revealed or withheld at a time, and what changes is recorded.\nFresh-context model witnesses first, because each call can start clean. Humans only through fixed, approved cohort protocols (A2.1 Rule 4).\nChallenges include: hide the prompt; hide model identity; withhold a time span or region and ask for a prediction of it; withhold one camera of a multi-view clip and ask for a reconstruction.\nInspired by self-consistency evaluation of world models (SC3-Eval, arXiv 2606.18610: cross-view inpainting, forward-inverse consistency, test-time drift flags) and by the BotNews article \"How to catch a world model lying to you\".\nThe combinatorics grow fast: plan small fixed partition sets, not every subset.\n\nA2.1 Part 2: Sphoenix decides at H4, after L04 to L12 are integrated and the first three human cases exist. Do not approve, auto-approve or build this proposal. It never blocks approved items and never expands their evaluation scope.\n\nAcceptance:\n- Proposal only: Sphoenix decides scope after L04 to L12 are integrated and the first three human cases exist.\n\nNarrowed slice approved as SC01 (A4, 2026-10-09). The remainder stays PROPOSED."

