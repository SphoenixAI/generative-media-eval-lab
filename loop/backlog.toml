probes = ["Which WP04 perturbation kinds can serve as a counterfactual edit and as a sham edit, and how are their doses verified? Cite file:line."]
acceptance = [
  "A reason prediction must be sealed before the counterfactual and sham variants are generated; a prediction timed after generation is rejected.",
  "Every test has both a counterfactual edit of the named factor and a sham edit of equal declared dose on an unrelated region or span; a test without a sham is INCONCLUSIVE.",
  "A variant whose dose is UNVERIFIED_DOSE makes the test INCONCLUSIVE.",
  "TEST-ONLY fixtures cover BACKED, UNBACKED and INCONCLUSIVE.",
  "Results are recorded beside the warrant; nothing edits a warrant, a relation, an assessment or a decision.",
  "HUMAN sessions are rejected until Sphoenix approves a human counterfactual protocol; MODEL sessions are accepted only for TEST-ONLY fixture clips, and no model is called.",
  "Tests and results are included in private dataset snapshots and absent from public and embed payloads.",
]
notes = """Sphoenix approval 2026-10-09, amendment A4. Narrowed from A3-04. Not D01: MODEL sessions are fixture-only.
SC3-Eval analogue: forward-inverse consistency. A stated reason has to predict what happens when the thing it names is changed.

ReasonPrediction: assessment ref; the Relation v2 warrant it tests; the named factor mapped to a WP04 measurand (REGION_COLOR, FRAME_CADENCE, SPEED or REFRAME); direction and dose; the predicted effect (the verdict changes to a named status, or does not change). Sealed with the L03 mechanism.
The WP04 generator produces the counterfactual variant and a sham variant. Doses are measured, and only VALIDATED, in-scope measurements verify them.
Results:
BACKED: the verdict moved as predicted under the counterfactual edit and did not move under the sham.
UNBACKED: the verdict did not move under the counterfactual edit, or moved under the sham as well.
INCONCLUSIVE: no sham, an unverified dose, or missing assessments.
Prior art for visual question answering: EDCT (arXiv 2510.00047) and EDCT-Bench (arXiv 2609.17953). The researcher verifies before docs cite them."""

