# Approved witness layer: A2 and A2.1. WP07 remains a proposal.

[[item]]
id = "WP01"
title = "Witness sessions with sequential unmasking"
priority = "P0"
approval = "APPROVED"
size = "L"
risk = "MEDIUM"
category = "domain"
depends_on = ["L03", "L04", "L05"]
human_review = false
authorized_protected = []
authorized_test_changes = []
authorized_dependencies = false
probes = ["Which L04 records and commands log a judge's views? Cite file:line.", "Confirm that IntentSpecV2 has no author field. Cite file:line."]
acceptance = ["A reveal before the blind statement is sealed is rejected.", "A post-reveal change without a reason, or timed before the reveal, is rejected.", "Blind statements and post-reveal changes are append-only, and tampering with a sealed statement fails verification.", "Blindness is derived, never typed: a logged view of the revealed intent lineage before the seal, or an authorship record for that intent, yields NOT_BLIND; otherwise BLIND. Each case has a test.", "A blind statement that references intent is rejected.", "In a TEST-ONLY fixture where a judge adds a camera-move observation after the reveal, the session reports one ADDED change in the CAMERA dimension.", "A MODEL session is accepted only for TEST-ONLY fixture clips, and no model is called.", "Witness records are included in private dataset snapshots and absent from public and embed payloads.", "Each sealed blind statement stores the set of exposed channels at sealing time, derived from append-only ExposureEvents; tests cover CLI-logged and declared exposures.", "A declared exposure can only add to the exposure set; nothing removes an exposure.", "Blindness is derived per channel, and A2's BLIND and NOT_BLIND refer to the INTENT channel.", "A reveal of any channel other than INTENT is rejected with a message naming proposal A3-01.", "A HUMAN session must use a named fixed protocol; a second session by the same judge on the same clip derives blindness from that judge's full exposure history, so it is NOT_BLIND on every channel the judge has already seen."]
notes = "Sphoenix approval 2026-10-09, amendment A2, Sections 5.2 and 5.3. Not D01: MODEL sessions are fixture-only.\n\nRecords:\nWitnessSession: id; judge_ref (an opaque id, no personal data); judge_kind (HUMAN or MODEL); clip ref; protocol_version; created_at.\nBlindStatement: session ref; observations in the L05 TechnicalObservation shape, with no intent refs; an optional intent_inference made of two strings, action and reason (\"This clip wants the viewer to <action> because <reason>\"); an optional list of the dimensions the judge thinks matter. Sealed with the L03 mechanism when it is created.\nIntentViewEvent: judge_ref; intent revision id; viewed_at. Appended whenever the CLI shows an intent to a named judge.\nIntentAuthorship, append-only: judge_ref; intent id; recorded_at. IntentSpecV2 has no author field, so authorship is recorded here, for example when an intent is sealed with --author.\nRevealEvent: session ref; the intent revision revealed; revealed_at.\nPostRevealChange, append-only: session ref; kind ADDED, CHANGED or WITHDRAWN; the observation, or a ref to the blind one; reason, required; created_at.\nAfter the reveal, assessments are ordinary L05 CriterionAssessments pinned to the revealed revision.\n\nBlindness is derived the way provenance is. BLIND means no recorded exposure. Viewing outside the CLI cannot be detected; document that limit as L04 does.\nReport per session: counts of ADDED, CHANGED and WITHDRAWN by dimension. No aggregation across sessions or judges.\nCLI, names may differ: eval-pilot witness start, blind, reveal, change, show.\n\nCommon approved constraints (A2 Section 5.3):\n- **I1.** For real clips, the loop never writes statements, changes, legibility matches or assessments. Instruments write InstrumentRun records only, never observations.\n- **I5.** Statements, instrument runs and claim checks never reference intent. Only post-reveal assessments and legibility matches do.\n- **I2.** Anything not measured is UNMEASURABLE or UNKNOWN, never a pass.\n- **I8, exactly as written:** \"No average hides a failure. Aggregates keep the worst case for each dimension. No decision uses a mean.\" Instruments report per-frame values and the worst frame alongside any span mean. Every claim check states which summary it uses, and checks that a failure could hide in use the worst frame.\n- **I9.** No probabilities.\n- **I12.** Canary status, judge identities and witness cards never appear in public or embed payloads.\n- **Snapshots.** New record types are included in private dataset snapshots. This is the gap that failed L11.\n- **Faces.** Instruments measure regions, color, timing and motion. They do no face identification, no expression or emotion reading, no deception scoring and no inference about a person's intent.\n- **Media.** Generate test clips with ffmpeg lavfi in a temp folder at test time. Never commit media files: G6 forbids video extensions, and G7 counts them as changed lines.\n- **Excluded tools.** No cloud media APIs. No new AGPL or GPL dependencies; the pinned ffmpeg build is existing human-installed tooling.\n- **Size.** Split an item with `STEP-N-split.toml` if it will not fit in 900 changed lines.\n\nA2.1 additions (override A2 where they conflict):\nExposure channels:\n- PIXELS\n- AUDIO\n- PROMPT\n- INTENT\n- MODEL_IDENTITY\n- OTHER_JUDGE_STATEMENT\n- INSTRUMENT_RESULT\n\nExposureEvent, append-only: judge_ref; channel; target ref; source (CLI_LOGGED or DECLARED); at. It replaces A2's IntentViewEvent, which becomes the ExposureEvent for channel INTENT.\n\nA judge may declare an exposure the CLI could not see, for example \"I read the prompt elsewhere\". Declarations can only add exposure, never remove it.\n\nEach BlindStatement stores the exposure set at sealing time, derived from the events. Blindness is derived per channel. A2's BLIND and NOT_BLIND now mean blindness on the INTENT channel, and every A2 rule that names them keeps that meaning.\n\nA RevealEvent names one channel. The CLI implements only the INTENT reveal for now. Revealing any other channel is rejected with a message saying it is deferred to proposal A3-01.\n\n`protocol_version` names a fixed protocol. Only one human protocol exists now:\n\nHUMAN_MEDIA_FIRST_V1:\n1. PIXELS and AUDIO only;\n2. seal the blind statement;\n3. reveal INTENT;\n4. log post-reveal changes;\n5. write assessments.\n\nA later cohort protocol, such as media plus prompt before sealing, needs Sphoenix's approval.\n\nAcceptance:\n- A reveal before the blind statement is sealed is rejected.\n- A post-reveal change without a reason, or timed before the reveal, is rejected.\n- Blind statements and post-reveal changes are append-only, and tampering with a sealed statement fails verification.\n- Blindness is derived, never typed: a logged view of the revealed intent lineage before the seal, or an authorship record for that intent, yields NOT_BLIND; otherwise BLIND. Each case has a test.\n- A blind statement that references intent is rejected.\n- In a TEST-ONLY fixture where a judge adds a camera-move observation after the reveal, the session reports one ADDED change in the CAMERA dimension.\n- A MODEL session is accepted only for TEST-ONLY fixture clips, and no model is called.\n- Witness records are included in private dataset snapshots and absent from public and embed payloads.\n- Each sealed blind statement stores the set of exposed channels at sealing time, derived from append-only ExposureEvents; tests cover CLI-logged and declared exposures.\n- A declared exposure can only add to the exposure set; nothing removes an exposure.\n- Blindness is derived per channel, and A2's BLIND and NOT_BLIND refer to the INTENT channel.\n- A reveal of any channel other than INTENT is rejected with a message naming proposal A3-01.\n- A HUMAN session must use a named fixed protocol; a second session by the same judge on the same clip derives blindness from that judge's full exposure history, so it is NOT_BLIND on every channel the judge has already seen.\n\nPriority raised to P0 by A4, 2026-10-09."

[[item]]
id = "WP02"
title = "Instrument contract with two dependency-free instruments"
priority = "P0"
approval = "APPROVED"
size = "M"
risk = "MEDIUM"
category = "domain"
depends_on = ["L03"]
human_review = false
authorized_protected = []
authorized_test_changes = []
authorized_dependencies = false
probes = ["How does media.py decode frames and record ToolIdentity, and can it decode at a fixed size in rgb24? Cite file:line.", "Is tests/fixtures/ciede2000_sharma2005.tsv present, with its source and SHA-256 header? If not, report it and leave the first acceptance string unmet."]
acceptance = ["CIEDE2000 matches every pair in tests/fixtures/ciede2000_sharma2005.tsv to within 0.0001.", "On synthetic clips encoded losslessly with FFV1 in an RGB pixel format, a known color change inside a region gives mean CIELAB values within 1.0 of the computed expectation on each component and a CIEDE2000 difference within 0.5 of it, and an unchanged region stays below 0.5 on every frame.", "Frame cadence finds two duplicated frames and one dropped frame at their exact indices in a synthetic clip.", "Two runs on the same inputs produce identical run records apart from created_at, and a different ffmpeg hash changes the instrument identity.", "An instrument run cannot reference intent, and no instrument creates an observation.", "An empty or out-of-frame region, or a span outside the decoded timeline, yields UNMEASURABLE with a reason.", "Instrument runs report per-frame values and the worst frame as well as span means, and are included in private dataset snapshots.", "Instrument validity is derived from append-only ValidationRecords; a spec with no record is UNVALIDATED, and no record is ever edited in place.", "A VALIDATED record without calibration evidence (test ids, fixture SHA-256s and code version) is rejected.", "Every instrument run records whether its inputs fall inside the instrument's validated domain and conditions, with the reason when they do not."]
notes = "Sphoenix approval 2026-10-09, amendment A2, Sections 5.2 to 5.4. Narrowed from D02: no new dependency, no model weights.\n\nInstrumentSpec: id; version; measurand (REGION_COLOR or FRAME_CADENCE for now); units; method; parameters; tolerance policy; executable identity (reuse pilot_domain.ToolIdentity); spec digest using the L03 canonical digest.\nInstrumentRun, append-only: spec ref and digest; clip ref (media checksum); inputs (region, spans); outputs with units; status COMPLETED, UNMEASURABLE (with a reason) or FAILED; created_at; run digest.\n\nREGION_COLOR: decode with the pinned ffmpeg at a fixed small size as rgb24. Average sRGB inside a rectangle given in normalized coordinates, or inside an optional external grayscale mask file decoded by ffmpeg; nothing here generates masks. Convert to CIELAB (D65). Report the per-frame Lab, the per-span mean Lab, the per-frame CIEDE2000 against a reference span, and the worst frame. Implement CIEDE2000 in the repository.\nFRAME_CADENCE: from frame timestamps and decoded-frame digests, report duplicated frames, suspected drops (a timestamp gap above 1.5 times the median frame interval) and the effective frame rate.\n\nGenerate test clips with lavfi at test time in a temp folder; never commit media.\nInstrument outputs are measurements, not observations. WP03 links them to a witness's claims.\nWhy color first: the 2026-10-09 search found no benchmark that scores grade or shot-to-shot color consistency in generated video. VBench's color dimension checks only whether colors match the prompt. Treat this as a research claim.\n\nCommon approved constraints (A2 Section 5.3):\n- **I1.** For real clips, the loop never writes statements, changes, legibility matches or assessments. Instruments write InstrumentRun records only, never observations.\n- **I5.** Statements, instrument runs and claim checks never reference intent. Only post-reveal assessments and legibility matches do.\n- **I2.** Anything not measured is UNMEASURABLE or UNKNOWN, never a pass.\n- **I8, exactly as written:** \"No average hides a failure. Aggregates keep the worst case for each dimension. No decision uses a mean.\" Instruments report per-frame values and the worst frame alongside any span mean. Every claim check states which summary it uses, and checks that a failure could hide in use the worst frame.\n- **I9.** No probabilities.\n- **I12.** Canary status, judge identities and witness cards never appear in public or embed payloads.\n- **Snapshots.** New record types are included in private dataset snapshots. This is the gap that failed L11.\n- **Faces.** Instruments measure regions, color, timing and motion. They do no face identification, no expression or emotion reading, no deception scoring and no inference about a person's intent.\n- **Media.** Generate test clips with ffmpeg lavfi in a temp folder at test time. Never commit media files: G6 forbids video extensions, and G7 counts them as changed lines.\n- **Excluded tools.** No cloud media APIs. No new AGPL or GPL dependencies; the pinned ffmpeg build is existing human-installed tooling.\n- **Size.** Split an item with `STEP-N-split.toml` if it will not fit in 900 changed lines.\n\nA2.1 additions (override A2 where they conflict):\nValidationRecord, append-only:\n- instrument spec ref and digest;\n- status: UNVALIDATED, PILOT or VALIDATED;\n- validated_measurand;\n- validated_domain (for example: 8-bit SDR, rgb24 decode, the codecs covered, a resolution range, a minimum region size in pixels);\n- validated_conditions;\n- known_blind_spots;\n- calibration_evidence: test ids, fixture SHA-256s and the code version;\n- authored_by and recorded_at.\n\nAn instrument's current status is derived from its latest ValidationRecord. A spec with no record is UNVALIDATED.\n\nWho may write records:\n- In tests, records exist only as TEST-ONLY fixtures.\n- For real use, only Sphoenix writes VALIDATED records, with a CLI command such as `eval-pilot instrument validate`.\n- The loop may write PILOT records whose evidence is synthetic tests only.\n\nEvery InstrumentRun records its upstream inputs:\n- the clip;\n- any mask or label file, as an imported-artifact ref with its SHA-256 and producing tool;\n- any earlier run whose outputs it consumed.\n\nIts evidence roots are the set of clip, import and root-run refs it descends from.\n\nAcceptance:\n- CIEDE2000 matches every pair in tests/fixtures/ciede2000_sharma2005.tsv to within 0.0001.\n- On synthetic clips encoded losslessly with FFV1 in an RGB pixel format, a known color change inside a region gives mean CIELAB values within 1.0 of the computed expectation on each component and a CIEDE2000 difference within 0.5 of it, and an unchanged region stays below 0.5 on every frame.\n- Frame cadence finds two duplicated frames and one dropped frame at their exact indices in a synthetic clip.\n- Two runs on the same inputs produce identical run records apart from created_at, and a different ffmpeg hash changes the instrument identity.\n- An instrument run cannot reference intent, and no instrument creates an observation.\n- An empty or out-of-frame region, or a span outside the decoded timeline, yields UNMEASURABLE with a reason.\n- Instrument runs report per-frame values and the worst frame as well as span means, and are included in private dataset snapshots.\n- Instrument validity is derived from append-only ValidationRecords; a spec with no record is UNVALIDATED, and no record is ever edited in place.\n- A VALIDATED record without calibration evidence (test ids, fixture SHA-256s and code version) is rejected.\n- Every instrument run records whether its inputs fall inside the instrument's validated domain and conditions, with the reason when they do not.\n\nPriority raised to P0 by A4, 2026-10-09."

[[item]]
id = "WP03"
title = "Cross-examination: checking witness claims against instruments"
priority = "P0"
approval = "APPROVED"
size = "M"
risk = "MEDIUM"
category = "domain"
depends_on = ["WP01", "WP02"]
human_review = false
authorized_protected = []
authorized_test_changes = []
authorized_dependencies = false
probes = []
acceptance = ["TEST-ONLY fixtures cover SUPPORTED, CONTRADICTED and UNMEASURABLE checks, and the GUIDED_NOTICE, SUGGESTED, UNRESOLVED, CORRECTED and ABANDONED_TRUE classes.", "A claim whose predicate has no instrument is UNMEASURABLE, never SUPPORTED or CONTRADICTED.", "Claim checks are append-only, and a re-check never overwrites an earlier one.", "Every claim check records which summary it used, and a claim that no shift occurs is checked against the worst frame.", "An assessment that cites a CONTRADICTED observation is flagged, and the flag never changes a stored assessment or a decision.", "The witness report is deterministic for fixed inputs, and claim records and checks are included in private dataset snapshots.", "A check by an UNVALIDATED or PILOT instrument, or by a VALIDATED instrument outside its validated domain or conditions, yields MEASURED_UNVALIDATED and never SUPPORTED or CONTRADICTED; each case has a test.", "MEASURED_UNVALIDATED keeps the measured value in the check record and in the witness report.", "Two checks whose runs share an evidence root count as one dependency family, and corroboration counts in reports and witness cards are family counts; a test uses two checks derived from one mask file.", "No check, class or report edits, hides or marks false any witness observation; CONTRADICTED is recorded beside the observation."]
notes = "Sphoenix approval 2026-10-09, amendment A2, Sections 5.2 and 5.3.\n\nClaimRecord: a checkable predicate attached to one witness observation, blind or post-reveal, from a closed vocabulary, each mapped to an existing Dimension:\nREGION_COLOR_SHIFT (region, span_a, span_b, and min_delta_e or max_delta_e): LIGHTING.\nFRAME_CADENCE_DEFECT (span; DUPLICATE or DROP): TEMPORAL.\nPRESENCE: SEMANTIC. POSITION: COMPOSITION. BODY_MOTION: MOTION. CAMERA_MOVE: CAMERA. These four are accepted and stay UNMEASURABLE until an instrument for them exists.\nClaimCheck, append-only: claim ref; instrument run ref; result SUPPORTED, CONTRADICTED or UNMEASURABLE; the summary used; measured value, threshold and margin; the tolerance policy used.\n\nClasses for post-reveal changes, from their checks:\nGUIDED_NOTICE: added or changed after the reveal, and SUPPORTED. The reveal pointed the judge at something real.\nSUGGESTED: added or changed after the reveal, and CONTRADICTED. The judge reported what the intent asked for, not what is there.\nCORRECTED: a withdrawn blind claim that is CONTRADICTED.\nABANDONED_TRUE: a withdrawn blind claim that is SUPPORTED. The reveal talked the judge out of something real.\nUNRESOLVED: no check, or UNMEASURABLE.\neval-pilot witness report SESSION lists claims, checks, classes and flags.\n\nCommon approved constraints (A2 Section 5.3):\n- **I1.** For real clips, the loop never writes statements, changes, legibility matches or assessments. Instruments write InstrumentRun records only, never observations.\n- **I5.** Statements, instrument runs and claim checks never reference intent. Only post-reveal assessments and legibility matches do.\n- **I2.** Anything not measured is UNMEASURABLE or UNKNOWN, never a pass.\n- **I8, exactly as written:** \"No average hides a failure. Aggregates keep the worst case for each dimension. No decision uses a mean.\" Instruments report per-frame values and the worst frame alongside any span mean. Every claim check states which summary it uses, and checks that a failure could hide in use the worst frame.\n- **I9.** No probabilities.\n- **I12.** Canary status, judge identities and witness cards never appear in public or embed payloads.\n- **Snapshots.** New record types are included in private dataset snapshots. This is the gap that failed L11.\n- **Faces.** Instruments measure regions, color, timing and motion. They do no face identification, no expression or emotion reading, no deception scoring and no inference about a person's intent.\n- **Media.** Generate test clips with ffmpeg lavfi in a temp folder at test time. Never commit media files: G6 forbids video extensions, and G7 counts them as changed lines.\n- **Excluded tools.** No cloud media APIs. No new AGPL or GPL dependencies; the pinned ffmpeg build is existing human-installed tooling.\n- **Size.** Split an item with `STEP-N-split.toml` if it will not fit in 900 changed lines.\n\nA2.1 additions (override A2 where they conflict):\nA new check result: MEASURED_UNVALIDATED. The instrument produced a value, but it is not VALIDATED, or this input is outside its validated domain or conditions. The value is kept and shown. It never supports or contradicts anything.\n\nNow:\n- SUPPORTED and CONTRADICTED require a VALIDATED instrument, used inside its validated scope.\n- UNMEASURABLE still means no value could be produced.\n- Post-reveal changes whose only checks are MEASURED_UNVALIDATED are classed UNRESOLVED.\n\nEvery ClaimCheck carries the evidence roots of its run. When several checks bear on one claim, the report groups them into dependency families: checks whose roots overlap form one family. Corroboration is counted in families, not checks. Witness cards count families.\n\nA2.1 Rule 5: An instrument measurement is evidence whose authority depends on validation. It is never ground truth because a machine produced it. CONTRADICTED means a VALIDATED, in-scope measurement disagrees with the observation. The observation stays stored, unchanged, and is never marked false.\n\nAcceptance:\n- TEST-ONLY fixtures cover SUPPORTED, CONTRADICTED and UNMEASURABLE checks, and the GUIDED_NOTICE, SUGGESTED, UNRESOLVED, CORRECTED and ABANDONED_TRUE classes.\n- A claim whose predicate has no instrument is UNMEASURABLE, never SUPPORTED or CONTRADICTED.\n- Claim checks are append-only, and a re-check never overwrites an earlier one.\n- Every claim check records which summary it used, and a claim that no shift occurs is checked against the worst frame.\n- An assessment that cites a CONTRADICTED observation is flagged, and the flag never changes a stored assessment or a decision.\n- The witness report is deterministic for fixed inputs, and claim records and checks are included in private dataset snapshots.\n- A check by an UNVALIDATED or PILOT instrument, or by a VALIDATED instrument outside its validated domain or conditions, yields MEASURED_UNVALIDATED and never SUPPORTED or CONTRADICTED; each case has a test.\n- MEASURED_UNVALIDATED keeps the measured value in the check record and in the witness report.\n- Two checks whose runs share an evidence root count as one dependency family, and corroboration counts in reports and witness cards are family counts; a test uses two checks derived from one mask file.\n- No check, class or report edits, hides or marks false any witness observation; CONTRADICTED is recorded beside the observation.\n\nPriority raised to P0 by A4, 2026-10-09."

