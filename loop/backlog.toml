rationale = "One perception pass per clip serves many measurements, while lineage stops reuse from posing as independent evidence."
notes = "Proposed 2026-10-09 (A3). Per clip, a temporal entity graph: entities (person, object, ground region) with mask tracks, appearance trajectories, pose trajectories, motion and color trajectories, and relations such as standing_on, holding and occluded_by. Downstream measurements (identity drift, position, contact, grade consistency, occlusion) reuse it.\nEvery derived value keeps its evidence roots (A2.1 Rule 3). A tracking error upstream is one witness, not many.\nSemantic grade consistency is the first payoff: a REGION_COLOR measurement on a tracked semantic region (skin, garment, product) through one shot, compared against illumination changes elsewhere in the frame.\n\nA2.1 Part 2: Sphoenix decides at H4, after L04 to L12 are integrated and the first three human cases exist. Do not approve, auto-approve or build this proposal. It never blocks approved items and never expands their evaluation scope.\n\nAcceptance:\n- Proposal only: Sphoenix decides scope after L04 to L12 are integrated and the first three human cases exist."

